<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Magistr harness and TUI modes</title>
  <desc id="desc">Two usage modes share the same native roadmap and workflow state. A coding-agent harness uses MCP and skills one work item at a time, handing off to a fresh agent session; the TUI opens the cockpit and owns the live loop, starting a fresh provider session per iteration.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8aa4b8"/></marker><style>.kicker{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px;fill:#8aa4b8}.title{font:700 30px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f7fb}.head{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}.body{font:650 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f7fb}.small{font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c8d4}.mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d8e4ed}</style></defs>
  <rect width="1200" height="560" rx="24" fill="#0d141c"/><text x="48" y="44" class="kicker">TWO WAYS TO USE MAGISTR</text><text x="48" y="82" class="title">Same state. Different loop owner.</text>
  <g role="group" aria-label="Agent harness mode"><rect x="48" y="132" width="516" height="254" rx="18" fill="#211c36" stroke="#b59cff" stroke-width="2"/><text x="78" y="168" class="head" fill="#b59cff">AGENT HARNESS · CODEX OR CLAUDE</text><text x="78" y="212" class="body">You talk to the agent.</text><text x="78" y="244" class="small">MCP exposes roadmap, think, ship, signal, and workspace tools.</text><text x="78" y="270" class="small">$next / /next runs one ready work item, then stops.</text><text x="78" y="296" class="small">$roadmap-refresh / /roadmap-refresh reshapes the plan.</text><rect x="78" y="326" width="454" height="34" rx="17" fill="#30254a"/><text x="103" y="348" class="mono">One work item per session; then a fresh agent session.</text></g>
  <g role="group" aria-label="Native TUI mode"><rect x="636" y="132" width="516" height="254" rx="18" fill="#122531" stroke="#65d9ff" stroke-width="2"/><text x="666" y="168" class="head" fill="#65d9ff">NATIVE TUI · MAGISTR</text><text x="666" y="212" class="body">Magistr owns the cockpit loop.</text><text x="666" y="244" class="small">The Roadmap tab shows the work items and the next ready one.</text><text x="666" y="270" class="small">magistr next-loop starts a fresh session per iteration.</text><text x="666" y="296" class="small">State persists so the loop can recover and continue.</text><rect x="666" y="326" width="454" height="34" rx="17" fill="#173541"/><text x="696" y="348" class="mono">The TUI is the interactive, host-owned loop.</text></g>
  <rect x="48" y="428" width="1104" height="64" rx="16" fill="#111d28" stroke="#314555"/><text x="72" y="456" class="head" fill="#7be495">SHARED NATIVE STATE</text><text x="278" y="456" class="small">Both modes use the same roadmap, checks, artifacts, and project configuration.</text>
</svg>
