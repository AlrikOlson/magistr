<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Magistr — pick up where you left off</title>
  <desc id="desc">Keep your coding project's plan, progress and test results together.</desc>
  <rect width="1200" height="630" fill="#f8f7f4" />
  <g transform="translate(80 64) scale(1.5)">
    <rect width="32" height="32" rx="7" fill="#17171d" />
    <path d="M7 24V8l9 10 9-10v16" fill="none" stroke="#bea8f2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="7" cy="8" r="2" fill="#67e8f9" />
    <circle cx="16" cy="18" r="2" fill="#a78bfa" />
    <circle cx="25" cy="8" r="2" fill="#fbbf24" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="145" y="99" fill="#23232b" font-size="34" font-weight="700" letter-spacing="-1">Magistr</text>
    <text x="80" y="278" fill="#23232b" font-size="92" font-weight="600" letter-spacing="-4">Pick up where</text>
    <text x="80" y="380" fill="#5a3e9e" font-size="92" font-weight="600" letter-spacing="-4">you left off.</text>
    <text x="84" y="456" fill="#64616c" font-size="27">Your plan, progress and test results. Ready for the next session.</text>
    <path d="M80 522h1040" stroke="#dedbd4" />
    <text x="84" y="568" fill="#64616c" font-size="21">For Codex &amp; Claude Code</text>
    <text x="1120" y="568" text-anchor="end" fill="#5a3e9e" font-size="21">magistr.dev</text>
  </g>
</svg>
