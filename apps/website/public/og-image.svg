<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Magistr: build bigger projects with your coding agent.</title>
  <desc id="desc">Magistr keeps the roadmap, the reasons behind decisions and the checks with your project, so the next session can continue.</desc>
  <rect width="1200" height="630" fill="#141916"/>
  <path d="M64 114V64l25 34 25-34v50" fill="none" stroke="#ff9b66" stroke-width="7"/>
  <path d="M80 114h18" stroke="#e7ebe3" stroke-width="5"/>
  <g font-family="Instrument Sans, Arial, Helvetica, sans-serif" fill="#edf0e7">
    <text x="138" y="103" font-size="38" font-weight="600">Magistr</text>
    <text x="64" y="255" font-size="68" font-weight="600">Build bigger projects</text>
    <text x="64" y="340" font-size="68" font-weight="600">with your coding agent.</text>
    <g fill="#b0b9ae" font-size="28">
      <text x="64" y="430">Magistr keeps the roadmap, the reasons behind decisions</text>
      <text x="64" y="474">and the checks with your project, so the next session can continue.</text>
      <text x="64" y="568" font-size="24">magistr.dev</text>
    </g>
  </g>
</svg>
