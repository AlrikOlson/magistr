<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Magistr native project state</title>
  <desc id="desc">A project checkout carries project configuration and a native workflow identity. Project state brings together roadmap, think, ship, and workspace capabilities, while agent runtimes and workspace tools connect through the local service.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8aa4b8"/></marker><style>.kicker{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px;fill:#8aa4b8}.title{font:700 30px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f7fb}.head{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px}.body{font:650 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f3f7fb}.small{font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c8d4}.mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#d8e4ed}</style></defs>
  <rect width="1200" height="560" rx="24" fill="#0d141c"/><text x="48" y="44" class="kicker">WHAT STAYS WITH THE PROJECT</text><text x="48" y="82" class="title">Roadmap, reasoning, work, and proof share local state.</text>
  <g role="group" aria-label="Project checkout"><rect x="48" y="132" width="286" height="248" rx="16" fill="#111d28" stroke="#65d9ff" stroke-width="2"/><text x="72" y="166" class="head" fill="#65d9ff">PROJECT CHECKOUT</text><text x="72" y="208" class="body">Your source and config</text><rect x="72" y="232" width="238" height="36" rx="9" fill="#0d2630"/><text x="88" y="255" class="mono">.magistr/project.json</text><rect x="72" y="278" width="238" height="36" rx="9" fill="#0d2630"/><text x="88" y="301" class="mono">.think-and-ship/project.json</text><text x="72" y="350" class="small">native project identity</text></g>
  <path d="M342 256H366" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arrow)"/>
  <g role="group" aria-label="Project state"><rect x="376" y="132" width="448" height="248" rx="16" fill="#16202b" stroke="#b59cff" stroke-width="2"/><text x="402" y="166" class="head" fill="#b59cff">PROJECT STATE</text><text x="402" y="207" class="body">Four connected project records</text><rect x="402" y="230" width="180" height="38" rx="10" fill="#122531"/><text x="420" y="254" class="mono">roadmap · priorities</text><rect x="618" y="230" width="180" height="38" rx="10" fill="#211c36"/><text x="638" y="254" class="mono">think · reasons</text><rect x="402" y="280" width="180" height="38" rx="10" fill="#302517"/><text x="420" y="304" class="mono">ship · actions</text><rect x="618" y="280" width="180" height="38" rx="10" fill="#152a22"/><text x="638" y="304" class="mono">workspace · tools</text><text x="402" y="350" class="small">read it again when a session resumes</text></g>
  <path d="M832 256H856" stroke="#8aa4b8" stroke-width="2" marker-end="url(#arrow)"/>
  <g role="group" aria-label="Agent and workspace clients"><rect x="866" y="132" width="286" height="248" rx="16" fill="#1b2028" stroke="#ffb86b" stroke-width="2"/><text x="890" y="166" class="head" fill="#ffb86b">CLIENTS</text><text x="890" y="207" class="body">Connect through MCP</text><rect x="890" y="232" width="238" height="38" rx="10" fill="#302517"/><text x="908" y="256" class="mono">Codex · Claude · Copilot</text><rect x="890" y="282" width="238" height="38" rx="10" fill="#122531"/><text x="908" y="306" class="mono">map · read · edit · run</text><text x="890" y="350" class="small">provider stays with you</text></g>
  <rect x="48" y="420" width="1104" height="72" rx="16" fill="#111d28" stroke="#314555"/><text x="72" y="450" class="head" fill="#7be495">RESUME WITHOUT RECONSTRUCTING CHAT</text><text x="72" y="474" class="small">The next session starts from the roadmap and recorded work already attached to the project.</text>
</svg>
