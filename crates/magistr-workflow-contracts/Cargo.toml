[package]
name = "magistr-workflow-contracts"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Canonical workflow records and projection values without storage or runtime effects"

[dependencies]
magistr-domain = { path = "../magistr-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
