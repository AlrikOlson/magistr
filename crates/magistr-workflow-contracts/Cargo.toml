[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-workflow-contracts"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Canonical workflow records and projection values without storage or runtime effects"

[dependencies]
magistr-domain = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
