[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-acp-agent"
version.workspace = true
edition = "2024"
description = "Magistr's ACP (Agent Client Protocol) agent side: the session registry, turn queue, permission relay and cancel plumbing every Provider stands on, served by `magistr acp-agent`"
license = "MIT"

[lib]
name = "magistr_acp_agent"
path = "src/lib.rs"

[dependencies]
# Protocol v1 only (schema::v1); the same pin as magistr-acp, the client side.
agent-client-protocol = { version = "3.5", features = ["stdio"] }
# The API providers' HTTP client: a streamed body read chunk by chunk, so a
# cancel can drop the response mid-stream. rustls with bundled roots rather
# than the default native-tls: on macOS the system-keychain root load took
# ~20 s per client, which is the agent's startup.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
# The CLI's --session-id takes a UUID, so every session id this agent mints is one.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
