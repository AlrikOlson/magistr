[package]
name = "magistr-protocol"
version = "0.1.0"
edition = "2024"
description = "JSON-RPC 2.0 protocol schema for Magistr — typed methods, notifications, and error codes for all engine domains. Zero TUI dependencies."
license = "MIT"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
magistr-engine = { path = "../magistr-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "net", "time"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "net", "rt"] }
