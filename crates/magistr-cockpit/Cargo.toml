[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-cockpit"
version = "0.1.0"
edition = "2024"
description = "Presentation-neutral session observations and semantic effect ports"
license = "MIT"
rust-version = "1.95"

[dependencies]
magistr-workflow-contracts = { version = "=0.1.0", path = "../magistr-workflow-contracts" }
magistr-domain = { version = "=0.1.0", path = "../magistr-domain" }
magistr-application = { version = "=0.1.0", path = "../magistr-application" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
