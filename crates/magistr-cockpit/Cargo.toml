[package]
name = "magistr-cockpit"
version = "0.1.0"
edition = "2024"
description = "Presentation-neutral session observations and semantic effect ports"
license = "MIT"
rust-version = "1.95"

[dependencies]
magistr-workflow-contracts = { path = "../magistr-workflow-contracts" }
magistr-domain = { path = "../magistr-domain" }
magistr-application = { path = "../magistr-application" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
