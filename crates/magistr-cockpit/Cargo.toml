[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-cockpit"
version.workspace = true
edition = "2024"
description = "Presentation-neutral session observations and semantic effect ports"
license = "MIT"
rust-version = "1.95"

[dependencies]
magistr-workflow-contracts = { workspace = true }
magistr-domain = { workspace = true }
magistr-application = { workspace = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = "1"
