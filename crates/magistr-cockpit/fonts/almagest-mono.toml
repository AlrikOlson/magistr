# Almagest Mono — the cockpit's bespoke mono face.
#
# An Iosevka (v34.8.1) custom build, compiled by scripts/build-mono-face.sh.
# This file is the design decision; the TTFs beside it are its output.
#
# The build is metric-pinned to the cell contract JetBrains Mono set, so
# swapping the face moved no cell, wrap point, grid or Px rhythm — only
# outlines changed:
#
#   upem 1000 · advance 600 (widths.Normal.shape) · line 1320 (leading),
#   split as hhea/OS2 ascent 1020 / descent -300 / lineGap 0 by the
#   build script's fonttools post-pass (Iosevka's `leading` sets the
#   total; the split is pinned afterwards so both rasterizers — fontdue
#   in magistr-tui and qs-text in magistr-gui2 — read the exact numbers
#   the goldens were measured on).
#
# Tailoring, each deliberate:
#   - spacing "fixed": strictly monospace, no ligature — qs-text shapes
#     whole Data runs, and a calt ligature would merge glyphs and break
#     the column-counted measure; "fixed" removes the class of bug.
#   - ss08 (PragmataPro style) as the base: the sober technical set,
#     the right register for a supervision cockpit.
#   - dotted zero: the one ornament, echoing the Almagest icon set's
#     star-dot stroke terminals (DESIGN.md §7).
#   - noCvSs: the cv/ss feature machinery is stripped — the shapes are
#     baked, the shaper never asks for alternates.

[buildPlans.AlmagestMono]
family = "Almagest Mono"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.AlmagestMono.variants]
inherits = "ss08"

[buildPlans.AlmagestMono.variants.design]
zero = "dotted"

[buildPlans.AlmagestMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.AlmagestMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.AlmagestMono.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.AlmagestMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.AlmagestMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.AlmagestMono.metricOverride]
leading = 1320
