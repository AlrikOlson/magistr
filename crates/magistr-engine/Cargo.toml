[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "build.rs", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-engine"
version.workspace = true
edition = "2024"
# magistr needs 1.89 (std::fs::File advisory locking).
rust-version = "1.89"
description = "Magistr session and workflow orchestration, cost governance, and native store integration"
license = "MIT"

[features]
# Domain experiment only; never enabled by the production hosts.
experimental-peer = []

[dependencies]
magistr-workflow-contracts = { workspace = true }
magistr-domain = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time"] }
# First-party workflow source; the admitted Magistr owner uses the existing
# native store. No ambient checkout, registry fallback, or second writer.
magistr-workflow = { workspace = true }
tracing = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"

[build-dependencies]
# The owner contract digest (build.rs) over this crate's source closure.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The owner endpoint's named pipe: its owner-only DACL, the peer token
# check and the serving process's user.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }
