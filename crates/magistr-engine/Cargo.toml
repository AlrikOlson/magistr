[package]
name = "magistr-engine"
version = "0.1.0"
edition = "2024"
# think-and-ship needs 1.89 (std::fs::File advisory locking).
rust-version = "1.89"
description = "Magistr session and workflow orchestration, cost governance, and native store integration"
license = "MIT"

[dependencies]
magistr-domain = { path = "../magistr-domain" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time"] }
# First-party workflow source; the admitted Magistr owner uses the existing
# native store. No ambient checkout, registry fallback, or second writer.
think-and-ship = { path = "../../subsystems/workflow/crates/think-and-ship" }
# The library's tool handlers are the one implementation of every native
# mutation; NativeEngines calls them directly, so it names rmcp's
# `Parameters` wrapper and `CallToolResult` — the same rmcp think-and-ship
# resolves to.
rmcp = { version = "3.1", features = ["server"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
