[package]
name = "magistr-engine"
version = "0.1.0"
edition = "2024"
# think-and-ship needs 1.89 (std::fs::File advisory locking).
rust-version = "1.89"
description = "Magistr session and workflow orchestration, cost governance, and native store integration"
license = "MIT"

[dependencies]
magistr-domain = { path = "../magistr-domain" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt"] }
# Native think-and-ship subsystem (roadmap / think / ship / signal engines run
# in-process, sharing the XDG store with any external think-and-ship server).
# Published form; see [patch.crates-io] in the workspace root for the local
# path override used while iterating on the library.
think-and-ship = "0.6.0"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
