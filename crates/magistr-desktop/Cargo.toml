[workspace]
resolver = "3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[package]
name = "magistr-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Open projects, review setup and work with agents in Magistr"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
magistr = { package = "magistr-cli", path = "../magistr-cli" }
magistr-cockpit = { path = "../magistr-cockpit" }
magistr-domain = { path = "../magistr-domain" }
magistr-application = { path = "../magistr-application" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
tauri = { version = "=2.12.0", default-features = false, features = ["wry", "compression", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
magistr-workspace = { path = "../magistr-workspace" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = "2"
