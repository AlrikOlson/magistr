[workspace]
resolver = "3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[package]
name = "magistr-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native desktop sessions for Magistr"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
magistr = { package = "magistr-cli", path = "../magistr-cli", default-features = false }
magistr-cockpit = { path = "../magistr-cockpit" }
magistr-gui2 = { path = "../magistr-gui2" }
magistr-workspace = { path = "../magistr-workspace" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

