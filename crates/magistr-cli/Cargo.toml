[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "build.rs", "templates/**", "assets/**"]
name = "magistr-cli"
version = "0.1.0"
edition = "2024"
description = "Roadmap and workflow management for coding agents"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/AlrikOlson/magistr"
homepage = "https://github.com/AlrikOlson/magistr"
keywords = ["cli", "agent", "scaffold", "workflow", "ai"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.95"

[lib]
name = "magistr"
path = "src/lib.rs"

[[bin]]
name = "magistr"
path = "src/main.rs"

[dependencies]
magistr-application = { version = "=0.1.0", path = "../magistr-application" }
magistr-domain = { version = "=0.1.0", path = "../magistr-domain" }
magistr-core = { version = "=0.1.0", path = "../magistr-core" }
magistr-workspace = { version = "=0.1.0", path = "../magistr-workspace" }
magistr-process = { version = "=0.1.0", path = "../magistr-process" }
magistr-engine = { version = "=0.1.0", path = "../magistr-engine" }
rmcp = { version = "3.1", features = ["server", "client", "transport-io"] }
magistr-workflow = { version = "=0.1.0", path = "../magistr-workflow" }
agent-client-protocol = "2.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
magistr-acp = { version = "=0.1.0", path = "../magistr-acp" }
magistr-acp-agent = { version = "=0.1.0", path = "../magistr-acp-agent" }
magistr-mcp = { version = "=0.1.0", path = "../magistr-mcp" }
magistr-cockpit = { version = "=0.1.0", path = "../magistr-cockpit" }
magistr-cockpit-runtime = { version = "=0.1.0", path = "../magistr-cockpit-runtime" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
similar = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
toml = "1.0.6"
toml_edit = "0.25"
which = "6.0"
ureq = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
quick-xml = "0.41"
tar = "0.4"
flate2 = "1"
shell-escape = "0.1"
tempfile = "3"

# The native workspace perf harness (chunk arch-14c10b): the retained
# tier-0 / tier-1 / references / worker round-trip gates measured over the
# retained synthetic corpora against the shipping worker binary.
# `cargo bench -p magistr-cli --bench workspace_bench -- --profile index`.
[[bench]]
name = "workspace_bench"
harness = false

[dev-dependencies]
magistr-acp = { version = "=0.1.0", path = "../magistr-acp", features = ["test-support"] }
assert_cmd = "2"
# The served workspace suites drive the binary as a real MCP client over its
# own stdio (a tokio child's pipes are already a transport) and validate every
# envelope against the retained schema.
rmcp = { version = "3.1", features = ["client"] }
jsonschema = { version = "0.49", default-features = false }
insta = "1"
predicates = "3"
proptest = "1"
rand = "0.8"
syn = { version = "2", features = ["full", "visit"] }
