[package]
name = "magistr-acp"
version = "0.1.0"
edition = "2024"
description = "Magistr's ACP (Agent Client Protocol) transport: spawns an ACP agent, drives the session, and bridges permission, filesystem and terminal requests"
license = "MIT"
publish = false

[lib]
name = "magistr_acp"
path = "src/lib.rs"

[dependencies]
magistr-application = { path = "../magistr-application" }
agent-client-protocol = "2.0"
futures = "0.3"
serde_json = "1"
thiserror = "2"
# `net` for the AsyncFd the pty master is read through.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The agent's terminals run on a pty pair: openpt/grantpt/unlockpt/ptsname,
# the window size, the non-blocking master, setsid + TIOCSCTTY in the child.
# Already in the workspace through magistr-tui.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
