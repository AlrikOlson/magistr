[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-acp"
version = "0.1.0"
edition = "2024"
description = "Magistr's ACP (Agent Client Protocol) transport: spawns an ACP agent, drives the session, and bridges permission, filesystem and terminal requests"
license = "MIT"

[lib]
name = "magistr_acp"
path = "src/lib.rs"

[features]
test-support = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
magistr-application = { version = "=0.1.0", path = "../magistr-application" }
magistr-process = { version = "=0.1.0", path = "../magistr-process" }
agent-client-protocol = "2.0"
base64 = "0.22"
futures = "0.3"
serde_json = "1"
thiserror = "2"
# `net` for the AsyncFd the pty master is read through.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# setsid + TIOCSCTTY in the terminal child; the pty pair is magistr-process's.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
