[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-domain"
version.workspace = true
edition = "2024"
description = "Deterministic Magistr identities, run rules, policy and verification values"
license = "MIT"

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1"
