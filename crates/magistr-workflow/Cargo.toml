[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-workflow"
version.workspace = true
edition = "2024"
# 1.89 for std::fs::File advisory locking (lock/unlock) — the dependency-free
# cross-process guard in think/persistence.rs (think-trace-durability).
rust-version = "1.89"
description = "Magistr's workflow families (think, ship, roadmap, signal): the repository-local fork of magistr, see subsystems/workflow/PROVENANCE.md"
license = "MIT"

[lib]
name = "magistr_workflow"
path = "src/lib.rs"

[dependencies]
magistr-workflow-contracts = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { workspace = true, features = ["deserialize"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "process", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
schemars = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
owo-colors = "4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
# Dyn-compatible async traits for the tracker port (tracker-port-seam). Native
# `async fn` in traits is stable but still NOT dyn-compatible
# (rust-lang/rust#133119), and `Box<dyn TrackerPort>` is what keeps the provider
# list out of the core.
async-trait = "0.1.92"
# `elicitation` is opt-in in rmcp and off by default: without it the whole
# server->client "ask the human" API is `#[cfg]`d out. See src/mcp/elicit.rs for
# why enabling it does NOT mean anything gets asked (mcp-elicitation-consent).
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
tokio-util = { version = "0.7", features = ["rt"] }
# The one owned-process mechanism every Magistr command runs through; the
# check command stays the caller's own shell line.
magistr-process = { workspace = true }
# Cloud sync transport (SyncTarget::Cloud, Phase 31d) — ships in the local server.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
chacha20poly1305 = "0.11"
base64 = "0.23"
quick-xml = "0.42"

tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"
# Validates Rust-built cloud envelopes against the canonical
# contract/unified-record-envelope.schema.json (Rust↔contract no-drift proof).
jsonschema = { version = "0.60", default-features = false }
# Mock HTTP server for the CloudClient unit tests (Phase 31d2a).
wiremock = "0.6"
# rmcp client feature is dev-only — it's used by the e2e tests to drive
# the server over a tokio::io::duplex transport (workflow_e2e).
rmcp = { version = "3.6.0", features = ["client"] }
