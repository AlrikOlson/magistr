[package]
name = "magistr-tui"
version = "0.1.0"
edition = "2024"
description = "The mission-control cockpit's terminal renderer — a cell buffer diffed and encoded as SGR + DEC 2026, the kitty and sixel pixel protocols, the terminal session and the input thread — over magistr-cockpit, with no ratatui underneath."
license = "MIT"
rust-version = "1.89"

[dependencies]
# The cockpit this crate renders: its core, layout, theme, cell and pixel
# painters. Shared transport/jobs come from cockpit-runtime; this crate owns the terminal.
magistr-cockpit = { path = "../magistr-cockpit" }
magistr-cockpit-runtime = { path = "../magistr-cockpit-runtime" }
magistr-application = { path = "../magistr-application" }
# Incremental prompt echo must never split a composed character.
unicode-segmentation = "1"
# The software rasterizer the compositors read pixel surfaces from and the
# screenshot gate rasterizes into; png-format reads and writes the goldens.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
# kitty `o=z`: zlib (RFC 1950) over the pixel payload before base64.
flate2 = "1"
# The screenshot gate's glyph rasterizer: pure Rust (ttf-parser underneath),
# no system fonts — the faces are embedded from fonts/ so every machine
# renders the same pixels (tui2-d0).
fontdue = "0.9"
# The runtime's event loop: the input thread's channel, the frame interval
# and select! over them.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The producer behind Msg::Engine: the in-process think-and-ship engines
# and their broadcast-socket feed. The live ACP session belongs to the CLI
# host, which owns the supervisor and the real session harness.
magistr-engine = { path = "../magistr-engine" }
# Protocol v1 only, as everywhere in the workspace: the session-update
# variants the relay matches on.
agent-client-protocol = "2.0"
# Native-frame payloads (the fake engines script them).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The two palettes (Catppuccin Mocha and Latte) and the WCAG luminance the
# dark/light decision is made with. Rendering-agnostic: no ratatui inside.
magistr-theme = { path = "../magistr-theme" }

[dev-dependencies]
divan = "0.1"
insta = "1"
proptest = "1"
# A temporary project root and store for the engine client tests.
tempfile = "3"
# tests/terminal_integrity: a producer that logs to stderr mid-run, the way
# think-and-ship's engines and the CLI's subscriber do.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# A VT emulator as the end-to-end oracle: the bytes a frame emits are
# replayed through it and every terminal cell compared with the buffer.
vt100 = "0.16"

# The terminal's file descriptors without unsafe: termios raw mode, poll on
# stdin with a timeout, the window size. Unix only — on Windows the
# process terminal is `term::unsupported` and the cockpit's entry points
# refuse to start (a console backend would replace that).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "stdio", "termios"] }

# A real pty pair for the RealTerminal tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "pipe", "pty"] }

[[bench]]
name = "render"
harness = false
