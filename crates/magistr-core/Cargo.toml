[package]
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE*", "PROVENANCE.md", "presets/**", "!**/.DS_Store", "!**/__pycache__/**", "!**/*.pyc", "!**/*.pyo"]
repository = "https://github.com/AlrikOlson/magistr"
name = "magistr-core"
version.workspace = true
edition = "2024"
description = "Frontend-agnostic domain types for Magistr — shared between desktop, CLI, and remote-attach consumers. Zero ratatui dependencies."
license = "MIT"

[dependencies]
magistr-domain = { workspace = true }
magistr-process = { workspace = true }
glob = "0.3"
ignore = "0.4"
magistr-engine = { workspace = true }
# The workspace's source-snapshot capability: the host's verification
# evidence is composed here from it and the project's gate configuration.
magistr-workspace = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { workspace = true, features = ["serialize", "deserialize"] }
shell-escape = "0.1"
thiserror = "2"
toml = "1.1.8"
toml_edit = "0.25"
tracing = "0.1"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
