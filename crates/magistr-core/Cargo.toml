[package]
name = "magistr-core"
version = "0.1.0"
edition = "2024"
description = "Frontend-agnostic domain types for Magistr — shared between TUI, GUI, and remote-attach consumers. Zero ratatui dependencies."
license = "MIT"

[dependencies]
magistr-domain = { path = "../magistr-domain" }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
ignore = "0.4"
magistr-engine = { path = "../magistr-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"
toml = "1.0.6"
tracing = "0.1"
ureq = "3"
which = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
