[commands]
"check" = "cargo check --workspace --all-targets"
"test" = "cargo nextest run --workspace"
"lint" = "cargo clippy --workspace --all-targets -- -D warnings"
"structure" = "./scripts/lint-structure.sh"
"format" = "cargo fmt"
"cargo-test" = "cargo test --workspace --no-fail-fast"
"cargo-build" = "cargo build --workspace"
"cargo-nextest" = "cargo nextest run --workspace --no-fail-fast"
"cargo-test-magistr-cli" = "cargo test -p magistr-cli"
"cargo-test-magistr-core" = "cargo test -p magistr-core"
"cargo-test-magistr-engine" = "cargo test -p magistr-engine"
"cargo-test-magistr-theme" = "cargo test -p magistr-theme"
"desktop-check" = "cargo check --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked"
"desktop-build" = "cargo build --manifest-path crates/magistr-desktop/Cargo.toml --locked"
"desktop-lint" = "cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked -- -D warnings"
"desktop-test" = "cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --locked"
"desktop-input" = "node --test crates/magistr-desktop/tests/*.mjs"
"desktop-visual" = "./scripts/screenshot-gate.sh"

[edit]
confirm_mode = "token"
