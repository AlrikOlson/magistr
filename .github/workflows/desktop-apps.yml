name: desktop apps

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".node-version"
      - ".python-version"
      - "scripts/desktop*.mjs"
      - "Launch Magistr.*"
      - ".github/workflows/desktop-apps.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".node-version"
      - ".python-version"
      - "scripts/desktop*.mjs"
      - "Launch Magistr.*"
      - ".github/workflows/desktop-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Installable desktop (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/magistr-desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Select the native target
        run: echo "DESKTOP_TARGET=$(rustc -vV | awk '/^host:/ { print $2 }')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/magistr-desktop
      - name: Check formatting and launcher syntax
        run: |
          cargo fmt --manifest-path crates/magistr-desktop/Cargo.toml -- --check
          node --check scripts/desktop.mjs
          node --test scripts/desktop-launcher.tests.mjs
      - name: Build native app and installer
        run: node scripts/desktop.mjs package --debug
      - name: Check desktop
        run: cargo check --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --target "$DESKTOP_TARGET" --features custom-protocol --locked
      - name: Lint desktop
        run: cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --target "$DESKTOP_TARGET" --features custom-protocol --locked -- -D warnings
      - name: Test desktop and process ownership
        run: |
          cargo test --manifest-path crates/magistr-desktop/Cargo.toml --target "$DESKTOP_TARGET" --features custom-protocol --locked
          cargo test -p magistr-process --target "$DESKTOP_TARGET" --locked
      - name: Verify the Mac app contents and child roles
        run: |
          APP="crates/magistr-desktop/target/$DESKTOP_TARGET/debug/bundle/macos/Magistr.app"
          codesign --verify --deep --strict "$APP"
          python crates/magistr-desktop/tests/process_roles.py "$APP/Contents/MacOS/magistr-desktop"
      - name: Upload app packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Magistr-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            crates/magistr-desktop/target/*/debug/bundle/dmg/*.dmg
