name: desktop apps

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  package:
    name: Desktop checks and installer (macOS)
    runs-on: macos-15
    # Cold desktop lint and test builds measured 621 s and about 600 s on 2026-10-22.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: ./.github/actions/install-nextest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/magistr-desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Select the native target
        run: echo "DESKTOP_TARGET=$(rustc -vV | awk '/^host:/ { print $2 }')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            crates/magistr-desktop -> target
          shared-key: desktop
          cache-workspace-crates: true
      - name: Install desktop test dependencies
        run: npm ci --prefix crates/magistr-desktop
      - name: Verify formatting, launcher and input contracts
        run: |
          cargo fmt --manifest-path crates/magistr-desktop/Cargo.toml -- --check
          node --check scripts/desktop.mjs
          node --test scripts/desktop-launcher.tests.mjs crates/magistr-desktop/tests/*.mjs
      - name: Check and lint development desktop targets
        run: python3 -B scripts/ci_timing.py --name desktop-lint --budget 900 -- cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --target "$DESKTOP_TARGET" --locked -- -D warnings
      - name: Compile development desktop tests
        run: python3 -B scripts/ci_timing.py --name desktop-test-build --budget 900 -- cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --target "$DESKTOP_TARGET" --locked --no-run
      - name: Test development desktop
        run: python3 -B scripts/ci_timing.py --name desktop-tests --budget 180 -- cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --target "$DESKTOP_TARGET" --locked
      - name: Build native app and installer
        run: python3 -B scripts/ci_timing.py --name desktop-package --budget 720 -- node scripts/desktop.mjs package --debug
      - name: Check and lint packaged desktop targets
        run: cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --target "$DESKTOP_TARGET" --features custom-protocol --locked -- -D warnings
      - name: Test packaged desktop and process ownership
        run: |
          cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --target "$DESKTOP_TARGET" --features custom-protocol --locked
          cargo nextest run -p magistr-process --target "$DESKTOP_TARGET" --locked
      - name: Verify Mac app contents and child roles
        run: |
          APP="crates/magistr-desktop/target/$DESKTOP_TARGET/debug/bundle/macos/Magistr.app"
          codesign --verify --deep --strict "$APP"
          python3 crates/magistr-desktop/tests/process_roles.py "$APP/Contents/MacOS/magistr-desktop"
      - name: Upload app packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Magistr-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: crates/magistr-desktop/target/*/debug/bundle/dmg/*.dmg
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-desktop
          path: |
            target/ci-timings/
            target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: warn
