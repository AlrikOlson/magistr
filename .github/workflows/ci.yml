name: CI

on:
  push:
    branches: [main, 'verify/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

# Jobs grant exactly what they need; nothing is inherited from the workflow.
permissions: {}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      rust: ${{ steps.plan.outputs.rust }}
      website: ${{ steps.plan.outputs.website }}
      desktop: ${{ steps.plan.outputs.desktop }}
      package: ${{ steps.plan.outputs.package }}
      contracts: ${{ steps.plan.outputs.contracts }}
      visual: ${{ steps.plan.outputs.visual }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      slices: ${{ steps.plan.outputs.slices }}
      slice_count: ${{ steps.plan.outputs.slice_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the affected verification contract
        id: plan
        run: python3 -B scripts/ci_plan.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-plan
          path: target/ci-plan.json

  policy:
    name: Workflow and selection policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify selection, required-check handling and timing deadlines
        run: |
          python3 -B scripts/ci_plan.tests.py
          python3 -B scripts/ci_timing.tests.py
      - name: Lint workflow syntax and expressions
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSL "$ACTIONLINT_URL" -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Audit workflows for security weaknesses
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          min-severity: medium
          persona: regular

  rust-build:
    name: Rust lint and test build
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - id: rust-cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ci-rust
      - uses: ./.github/actions/install-nextest
      - name: Check selected Rust targets and compile their tests once
        env:
          CI_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci_timing.py --name rust-build --budget 900 --cold-budget 1500 --cache-hit "$RUST_CACHE_HIT" -- python3 -B scripts/ci_run.py rust-build
      - name: Share the exact build with test workers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-build
          path: target/ci-tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-rust-build
          path: target/ci-timings/
          retention-days: 7
          if-no-files-found: warn

  rust-tests:
    name: Rust tests
    needs: [plan, rust-build]
    if: needs.plan.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
      matrix:
        slice: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: ./.github/actions/install-nextest
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/website/package-lock.json
      - run: npm ci --prefix scripts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: test-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-registry-${{ runner.os }}-
      - run: cargo fetch --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/BytecodeAlliance.wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/magistr-workspace/**/*.wasm') }}
          restore-keys: wasmtime-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-test-build
          path: target
      - name: Run this slice of the compiled tests
        env:
          CI_PARTITION: ${{ matrix.slice }}/${{ needs.plan.outputs.slice_count }}
        run: python3 -B scripts/ci_timing.py --name rust-tests --budget 600 --junit target/nextest/ci/junit.xml --junit target/nextest/diagnostic/junit.xml -- python3 -B scripts/ci_run.py rust-test --partition "$CI_PARTITION"
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-rust-tests-${{ matrix.slice }}
          path: |
            target/ci-timings/
            target/nextest/*/junit.xml
          retention-days: 7
          if-no-files-found: warn

  website:
    name: Website
    needs: plan
    if: needs.plan.outputs.website == 'true'
    # Real Safari WebKit for the interaction checks.
    runs-on: macos-15
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/website/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/website/package-lock.json') }}
          restore-keys: webkit-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci --prefix apps/website
      - run: cd apps/website && npx --no-install playwright install webkit
      - name: Build and verify website content
        run: python3 -B scripts/ci_timing.py --name website-build --budget 120 -- npm --prefix apps/website test
      - name: Verify website interactions
        run: python3 -B scripts/ci_timing.py --name website-ui --budget 240 -- npm --prefix apps/website run test:ui
      - name: Assert clean-checkout public assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in apps/website/public/favicon.svg apps/website/public/screenshots/desktop-dark.png apps/website/public/screenshots/desktop-light.png apps/website/public/screenshots/captures.json crates/magistr-desktop/ui/icon.png; do
            git ls-files --error-unmatch "$asset" >/dev/null
            if git check-ignore --no-index -q "$asset"; then
              echo "Tracked public asset is still ignored: $asset" >&2
              exit 1
            fi
          done
          ! grep -R -n '/logo\.png' apps/website/src
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-website
          path: target/ci-timings/
          retention-days: 7
          if-no-files-found: warn

  contracts:
    name: Source gates and script suites
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    # Scripted gates need Cargo metadata and Node, not a macOS host.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: python3 -B scripts/ci_timing.py --name contracts --budget 300 -- python3 -B scripts/ci_run.py contracts
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-contracts
          path: target/ci-timings/
          retention-days: 7
          if-no-files-found: warn

  visual:
    name: Visual evidence
    needs: plan
    if: needs.plan.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The iteration archive the gate validates is the magistr-evidence submodule.
          submodules: true
      - run: python3 -B scripts/ci_timing.py --name visual-evidence --budget 120 -- bash scripts/screenshot-gate.sh
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-visual
          path: target/ci-timings/
          retention-days: 7
          if-no-files-found: warn

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-apps.yml
    permissions:
      contents: read

  package:
    name: Package and verify (macOS)
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - id: rust-cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: cli-release
      # A cold release build of the whole workspace measured 742-800 s on 2026-10-22.
      - name: Build host archive
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: python3 -B scripts/ci_timing.py --name cli-package --budget 900 --cold-budget 1500 --cache-hit "$RUST_CACHE_HIT" -- bash scripts/package-release.sh
      - name: Verify archive checksums
        run: cd target/release-dist && for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
      - name: Save timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-package
          path: target/ci-timings/
          retention-days: 7
          if-no-files-found: warn

  # The one required status check for main. Every job the plan selected must have
  # succeeded; every job it did not select must have been skipped, never missing.
  ci:
    name: CI
    needs: [plan, policy, rust-build, rust-tests, website, contracts, visual, desktop, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require every selected result, including all test slices
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci_plan.py --assert-needs

  deploy-website:
    name: Deploy website
    needs: [plan, ci]
    # !cancelled() keeps the implicit success() check from skipping this job whenever
    # a job upstream of the aggregate was skipped by the plan (a docs-only push).
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.website == 'true' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Website deploy skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from main."
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version-file: .node-version
          # A deployment builds from scratch: no cache can shape what is published.
          package-manager-cache: false
      - name: Build the website
        if: steps.gate.outputs.configured == 'true'
        run: |
          npm ci --prefix scripts
          npm ci --prefix apps/website
          npm --prefix apps/website run build
      - name: Publish to Cloudflare Pages
        if: steps.gate.outputs.configured == 'true'
        run: npm exec --prefix scripts --no -- wrangler pages deploy apps/website/dist --project-name magistr --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify the deployed launch pages
        if: steps.gate.outputs.configured == 'true'
        run: ./scripts/public-link-check.sh --stage website --out target/website-readiness.json
