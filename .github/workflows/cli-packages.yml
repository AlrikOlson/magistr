name: CLI packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cli-packages
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify publishable packages
    runs-on: macos-15
    # Publishable artifacts build cold on purpose: no cache can influence them.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Check native platform
        run: test "$(uname -m)" = arm64
      - name: Check release versions
        run: python3 -B scripts/version.py check
      - name: Build publishable artifacts
        run: python3 -B scripts/ci_timing.py --name distribution-build --budget 1800 -- python3 scripts/distribution.py prepare --out target/cli-distribution
      - name: Verify extracted Cargo installation
        run: python3 -B scripts/ci_timing.py --name distribution-cargo --budget 1200 -- python3 scripts/distribution.py verify-cargo --out target/cli-distribution
      - name: Verify packed npm installation
        run: python3 -B scripts/ci_timing.py --name distribution-npm --budget 300 -- python3 scripts/distribution.py verify-npm --out target/cli-distribution
      - name: Test unified protocol and onboarding
        run: |
          MAGISTR_TEST_BINARY=target/release/magistr python3 scripts/unified-mcp-check.py
          MAGISTR_TEST_BINARY=target/release/magistr python3 scripts/onboarding-check.py
      - name: Scan current security and bind the artifacts
        uses: ./.github/actions/release-security
        with:
          source: ${{ github.sha }}
          receipt: target/cli-distribution/security-verification.json
          artifacts: target/cli-distribution
      - name: Verify complete artifact receipts
        run: python3 scripts/cli-release.py verify --out target/cli-distribution --source "$GITHUB_SHA"
      - name: Attest build provenance of the reviewed archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/cli-distribution/*.crate
            target/cli-distribution/*.tgz
      - name: Save distribution timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-cli-distribution
          path: target/ci-timings/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-distribution
          path: target/cli-distribution/
          if-no-files-found: error
