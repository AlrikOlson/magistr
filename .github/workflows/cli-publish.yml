name: Publish CLI packages

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful CLI packages run ID containing the reviewed artifacts
        required: true
        type: string
      registry:
        description: Registry to publish (first npm publication is manual; see docs/releasing-cli.md)
        required: true
        type: choice
        options: [cargo, npm]
      resume_run:
        description: Previous Cargo publication run ID, required when continuing an interrupted upload
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: cli-release
    runs-on: macos-15
    # First publication of 14 crates can spend 90 minutes on registry quotas.
    # This job performs no Rust build; upload waits are bounded separately.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Select verified source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          source_sha=$(python3 scripts/cli-release.py select --repository "$RELEASE_REPOSITORY" --run-id "$PACKAGE_RUN" --resume-run "$RESUME_RUN")
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-distribution
          path: target/cli-distribution
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - name: Restore previous Cargo publication receipt
        if: inputs.registry == 'cargo' && inputs.resume_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-publication
          path: target/cli-distribution
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Verify reviewed artifacts, installations and current security receipt
        id: artifacts
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          verified=$(python3 scripts/cli-release.py verify --out target/cli-distribution --source "$SOURCE_SHA")
          npm_archive=$(printf '%s' "$verified" | python3 -c 'import json,sys; print(json.load(sys.stdin)["npm"])')
          npm_tag=$(printf '%s' "$verified" | python3 -c 'import json,sys; print(json.load(sys.stdin)["npmTag"])')
          echo "npm=$npm_archive" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
      - name: Check current public installation and support routes
        run: ./scripts/public-link-check.sh --stage publication --out target/publication-readiness.json
      - name: Publish exact Cargo archives in dependency order
        if: inputs.registry == 'cargo'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/cli-release.py publish-cargo --out target/cli-distribution --source "$SOURCE_SHA" --max-wait 7200
      - name: Retain completed and uncertain Cargo effects
        if: always() && inputs.registry == 'cargo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-publication
          path: target/cli-distribution/cargo-publication.json
          if-no-files-found: warn
          overwrite: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.registry == 'npm'
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish npm with trusted publishing
        if: inputs.registry == 'npm'
        env:
          NPM_ARCHIVE: ${{ steps.artifacts.outputs.npm }}
          # The dist-tag comes from the reviewed artifact version: a pre-release
          # publishes on `beta`; `latest` is reserved for stable versions.
          NPM_TAG: ${{ steps.artifacts.outputs.npm_tag }}
        run: npm publish "target/cli-distribution/$NPM_ARCHIVE" --access public --tag "$NPM_TAG"
