name: public release readiness

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fresh runners do not reuse incremental caches or debug builds for debugging.
# Keep the complete check/test/lint sequence within their available storage.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust and website gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record available build storage
        run: df -h .
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release artifact validation
        run: python3 -B scripts/cli-release.tests.py
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run workspace tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Record Rust build storage
        if: always()
        run: |
          df -h .
          test ! -d target || du -sh target
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Test website
        working-directory: apps/website
        run: npm ci && npm test
      - name: Assert clean-checkout public assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            apps/website/public/favicon.svg \
            apps/website/public/screenshots/desktop-dark.png \
            apps/website/public/screenshots/desktop-light.png \
            apps/website/public/screenshots/captures.json \
            crates/magistr-desktop/ui/icon.png; do
            git ls-files --error-unmatch "$asset" >/dev/null
            if git check-ignore --no-index -q "$asset"; then
              echo "Tracked public asset is still ignored: $asset" >&2
              exit 1
            fi
          done
          ! grep -R -n '/logo\.png' apps/website/src

  desktop:
    name: Desktop gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop test dependencies
        working-directory: crates/magistr-desktop
        run: npm ci
      - name: Record available desktop build storage
        run: df -h .
      - name: Format desktop
        run: cargo fmt --manifest-path crates/magistr-desktop/Cargo.toml -- --check
      - name: Check desktop
        run: cargo check --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked
      - name: Build desktop
        run: cargo build --manifest-path crates/magistr-desktop/Cargo.toml --locked
      - name: Lint desktop
        run: cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test desktop and protocol roles
        run: cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --locked
      - name: Record desktop build storage
        if: always()
        run: |
          df -h .
          test ! -d crates/magistr-desktop/target || du -sh crates/magistr-desktop/target
      - name: Test desktop input and stream contracts
        run: node --test crates/magistr-desktop/tests/*.mjs
      - name: Check current visual evidence, contrast and icon
        run: ./scripts/screenshot-gate.sh

  package:
    name: Package and verify (${{ matrix.os }})
    needs: [quality, desktop]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build host archive
        run: ./scripts/package-release.sh
      - name: Verify archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-dist
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done

  public-links:
    name: Anonymous public endpoint gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Probe configured public URLs
        run: PUBLIC_RELEASE_STRICT=1 ./scripts/public-link-check.sh
