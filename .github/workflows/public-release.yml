name: public release readiness

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep debug output bounded; reusable dependency builds are cached separately.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust and website gates
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Fetch the complete locked dependency graph
        run: cargo fetch --locked
      - name: Record available build storage
        run: df -h .
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release versions and artifact validation
        run: |
          python3 -B scripts/version.py check
          python3 -B scripts/version.tests.py
          python3 -B scripts/cli-release.tests.py
          python3 -B scripts/cargo_publication.tests.py
          python3 -B scripts/public_link_check.tests.py
          python3 -B scripts/release-security.tests.py
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/website/package-lock.json
      - name: Install locked development tools
        run: npm ci --prefix scripts
      - name: Run workspace tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Record Rust build storage
        if: always()
        run: |
          df -h .
          test ! -d target || du -sh target
      - name: Test website
        working-directory: apps/website
        run: |
          npm ci
          npm test
          npx --no-install playwright install webkit
          npm run test:ui
      - name: Assert clean-checkout public assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            apps/website/public/favicon.svg \
            apps/website/public/screenshots/desktop-dark.png \
            apps/website/public/screenshots/desktop-light.png \
            apps/website/public/screenshots/captures.json \
            crates/magistr-desktop/ui/icon.png; do
            git ls-files --error-unmatch "$asset" >/dev/null
            if git check-ignore --no-index -q "$asset"; then
              echo "Tracked public asset is still ignored: $asset" >&2
              exit 1
            fi
          done
          ! grep -R -n '/logo\.png' apps/website/src

  desktop:
    name: Desktop gates (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-nextest
        uses: ./.github/actions/install-nextest
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install desktop test dependencies
        working-directory: crates/magistr-desktop
        run: npm ci
      - name: Record available desktop build storage
        run: df -h .
      - name: Format desktop
        run: cargo fmt --manifest-path crates/magistr-desktop/Cargo.toml -- --check
      - name: Check desktop
        run: cargo check --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked
      - name: Build desktop
        run: cargo build --manifest-path crates/magistr-desktop/Cargo.toml --locked
      - name: Lint desktop
        run: cargo clippy --manifest-path crates/magistr-desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test desktop and protocol roles
        run: cargo nextest run --manifest-path crates/magistr-desktop/Cargo.toml --locked
      - name: Record desktop build storage
        if: always()
        run: |
          df -h .
          test ! -d crates/magistr-desktop/target || du -sh crates/magistr-desktop/target
      - name: Test desktop input and stream contracts
        run: node --test crates/magistr-desktop/tests/*.mjs
      - name: Check current visual evidence, contrast and icon
        run: ./scripts/screenshot-gate.sh

  package:
    name: Package and verify (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Build host archive
        run: ./scripts/package-release.sh
      - name: Verify archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-dist
          for checksum in *.sha256; do
            shasum -a 256 -c "$checksum"
          done

  public-links:
    name: Anonymous public endpoint gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Probe configured public URLs
        env:
          PUBLIC_GATE_STAGE: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && 'release' || 'website' }}
        run: ./scripts/public-link-check.sh --stage "$PUBLIC_GATE_STAGE" --out target/public-release-readiness.json
