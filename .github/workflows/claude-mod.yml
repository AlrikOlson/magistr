name: Claude adapter contracts

on:
  push:
    branches: [main]
    paths:
      - 'plugins/magistr/**'
      - '.claude-plugin/**'
      - 'docs/architecture/claude-mod.md'
      - 'docs/architecture/overview.md'
      - 'docs/architecture/clients.md'
      - 'docs/reference/claude-mod-verification.md'
      - '.github/workflows/claude-mod.yml'
      - '.node-version'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
  pull_request:
    paths:
      - 'plugins/magistr/**'
      - '.claude-plugin/**'
      - 'docs/architecture/**'
      - 'docs/reference/claude-mod-verification.md'
      - '.github/workflows/claude-mod.yml'
      - '.node-version'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: claude-mod-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    name: Independent contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked development tools
        run: npm ci --prefix scripts --ignore-scripts
      - name: Check JavaScript formatting
        run: npm exec --prefix scripts --no -- prettier --check "plugins/magistr/hooks/*.js" "plugins/magistr/tests/*.{js,mjs,ts}"
      - name: Run decoder, renderer and handler contracts
        run: node --test plugins/magistr/tests/wire.contract.mjs plugins/magistr/tests/interaction.contract.mjs
      # Official host tests require an enabled, authenticated Claude installation.
      # Independent contracts do not establish live Claude or Desktop compatibility.
