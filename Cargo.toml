[workspace]
members = [
    "crates/magistr-cli",
    "crates/magistr-engine",
    "crates/magistr-domain",
    "crates/magistr-application",
    "crates/magistr-acp",
    "crates/magistr-acp-agent",
    "crates/magistr-core",
    "crates/magistr-mcp",
    "crates/magistr-theme",
    "crates/magistr-cockpit",
    "crates/magistr-cockpit-runtime",
    "crates/magistr-workflow",
    "crates/magistr-workflow-contracts",
    "crates/magistr-workspace",
    "crates/magistr-process",
]
# The OS WebView host has an explicit separate lockfile and CI lane.
exclude = ["crates/magistr-desktop"]
default-members = ["crates/magistr-cli"]
resolver = "3"

# Canonical product version. Use scripts/version.py set to change it.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
# Registry requirements are generated from workspace.package.version.
magistr-cli = { version = "=0.1.0", path = "crates/magistr-cli" }
magistr-engine = { version = "=0.1.0", path = "crates/magistr-engine" }
magistr-domain = { version = "=0.1.0", path = "crates/magistr-domain" }
magistr-application = { version = "=0.1.0", path = "crates/magistr-application" }
magistr-acp = { version = "=0.1.0", path = "crates/magistr-acp" }
magistr-acp-agent = { version = "=0.1.0", path = "crates/magistr-acp-agent" }
magistr-core = { version = "=0.1.0", path = "crates/magistr-core" }
magistr-mcp = { version = "=0.1.0", path = "crates/magistr-mcp" }
magistr-theme = { version = "=0.1.0", path = "crates/magistr-theme" }
magistr-cockpit = { version = "=0.1.0", path = "crates/magistr-cockpit" }
magistr-cockpit-runtime = { version = "=0.1.0", path = "crates/magistr-cockpit-runtime" }
magistr-workflow = { version = "=0.1.0", path = "crates/magistr-workflow" }
magistr-workflow-contracts = { version = "=0.1.0", path = "crates/magistr-workflow-contracts" }
magistr-workspace = { version = "=0.1.0", path = "crates/magistr-workspace" }
magistr-process = { version = "=0.1.0", path = "crates/magistr-process" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Same for test profile (inherits from dev, but explicit is clearer)
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
