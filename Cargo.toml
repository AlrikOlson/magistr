[workspace]
members = [
    "crates/magistr-cli",
    "crates/magistr-engine",
    "crates/magistr-domain",
    "crates/magistr-application",
    "crates/magistr-acp",
    "crates/magistr-acp-agent",
    "crates/magistr-core",
    "crates/magistr-mcp",
    "crates/magistr-theme",
    "crates/magistr-cockpit",
    "crates/magistr-cockpit-runtime",
    "crates/magistr-workflow",
    "crates/magistr-workflow-contracts",
    "crates/magistr-workspace",
    "crates/magistr-process",
]
# The OS WebView host has an explicit separate lockfile and CI lane.
exclude = ["crates/magistr-desktop"]
default-members = ["crates/magistr-cli"]
resolver = "3"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Same for test profile (inherits from dev, but explicit is clearer)
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"


